name: onesmarter-web-ec2

x-app: &app
  image: onesmarter-web:ec2
  restart: unless-stopped
  init: true
  env_file:
    - ./.env
  environment:
    NODE_ENV: production
    PORT: "3000"
    HOST: "0.0.0.0"
    NODE_OPTIONS: --max-old-space-size=256
  mem_limit: 384m
  volumes:
    - cafe_drafts:/app/src/data/cafeConversations/drafts
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  app1:
    <<: *app

  app2:
    <<: *app

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/ec2/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 128m
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cafe_drafts:
