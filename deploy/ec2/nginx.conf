upstream onesmarter_app {
    least_conn;
    server app1:3000;
    server app2:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 64k;

    # IP-based HTTP testing: omit HTTPS-upgrade directives.
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Strict-Transport-Security;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com https://stats.g.doubleclick.net; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://analytics.google.com https://www.googletagmanager.com https://stats.g.doubleclick.net; manifest-src 'self'; worker-src 'self'; form-action 'self'" always;

    location / {
        proxy_pass http://onesmarter_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        proxy_next_upstream off;
    }
}
